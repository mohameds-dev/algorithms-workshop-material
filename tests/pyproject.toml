[project]
name = "algorithms-workshop-tests"
version = "0.1.0"
description = "Test suite for algorithm_implementation/ solutions."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["sorting"]
addopts = "-ra"
